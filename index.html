/* Le Grand Paris — guide de style unique (inspiration : party games console).
   Trois surfaces, pas une de plus :
   1. PANNEAU  : crème, liseré blanc 4 px, grand arrondi, ombre portée « jouet » (barre d'action, fenêtres, menus, cartes d'accueil).
   2. TUILE    : blanche, filet gris 2 px, arrondi moyen, ombre courte (tout ce qui se range DANS un panneau).
   3. PASTILLE : verre sombre, texte blanc, arrondi plein (informations posées sur la scène 3D).
   + les PLAQUES, qui prennent la couleur du joueur. Un seul jeu d'icônes (trait 2,4 px), deux polices embarquées. */

:root{
  color-scheme:light;
  /* couleurs */
  --ink:#14213D; --ink2:#3A4A6B; --muted:#56637C; --cream:#FFF8EC; --paper:#FFFFFF; --line:#E3E8F0; --line2:#D3DBE6;
  --glass:rgba(14,22,44,.68); --glass2:rgba(14,22,44,.84); --glass-edge:rgba(255,255,255,.16);
  --yellow:#FFD23F; --yellow-dk:#D99E00; --green:#2BC46B; --green-dk:#16904A; --red:#F2463A; --red-dk:#B01F17; --blue:#3D8BFD; --blue-dk:#1F5FC4;
  --g0:#955436; --g1:#8FD3F5; --g2:#D93A96; --g3:#F7941D; --g4:#ED1B24; --g5:#F5E000; --g6:#1FB25A; --g7:#0072BB;
  /* typographie */
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --t-xs:11px; --t-sm:13px; --t-md:15px; --t-lg:17px;
  --h-xs:15px; --h-sm:18px; --h-md:22px; --h-lg:28px; --h-xl:40px;
  /* formes */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:24px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --edge:4px solid #fff;
  --sh-panel:0 6px 0 rgba(20,33,61,.14),0 18px 40px rgba(10,20,40,.28);
  --sh-tile:0 3px 0 var(--line2);
  --sh-chip:0 3px 0 rgba(0,0,0,.22);
  --spring:cubic-bezier(.3,1.5,.5,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(#4FB3EE,#BFE6FF 70%,#E9F7FF) fixed;color:var(--ink);font-family:var(--body);font-size:var(--t-md);font-weight:700;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
input[type=text],input[type=number],select{font:inherit;font-weight:800;color:var(--ink);background:var(--paper);border:2px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px;min-width:0;box-shadow:inset 0 2px 0 rgba(20,33,61,.05)}
input[type=text]:focus,input[type=number]:focus{border-color:var(--yellow);outline:none}

/* ---------- icônes ---------- */
.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}
.fi{--fc:#8FA0B8;--fi:#fff;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--fc);color:var(--fi);flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.fi .i{width:14px;height:14px;stroke-width:2.8}

/* ---------- textes partagés ---------- */
.eyebrow,.menu p,.stat small,.pc .ph small,.dh small,.rcard small,.slot small,.bidder small,.pcard small,.bigcard .bh small,.logo small,.opt small{
  font-family:var(--body);font-weight:900;font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase}
.note{font-size:var(--t-sm);color:var(--muted);margin:0;line-height:1.45;font-weight:700}

/* ---------- 1. PANNEAUX ---------- */
.card,.prompt,.sheet,.menu,.pcard{background:var(--cream);border:var(--edge);border-radius:var(--r-lg);box-shadow:var(--sh-panel)}
/* ---------- 2. TUILES ---------- */
.tile,.pc,.tcol,.offerbox .side,.stat,.emptybox,.loglist li,.bidder,.mdeed,.rcard,.code,.seg button,.ptab,.tchip{background:var(--paper);border:2px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-tile)}
/* ---------- 3. PASTILLES ---------- */
.chip,.ib,.tool,.feed>div,.ptag,.photobar,.toast{background:var(--glass);color:#fff;border:2px solid var(--glass-edge);box-shadow:var(--sh-chip);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ---------- boutons « bonbon » ---------- */
.gb{--b:var(--yellow);--bd:var(--yellow-dk);--t:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);border:0;border-radius:var(--r-md);padding:12px 22px;
  font-family:var(--display);font-size:20px;letter-spacing:.03em;text-transform:uppercase;line-height:1;background:linear-gradient(color-mix(in srgb,var(--b) 78%,#fff),var(--b) 55%);
  color:var(--t);box-shadow:0 5px 0 var(--bd),0 10px 18px rgba(10,20,40,.2);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
.gb:hover:not(:disabled){filter:brightness(1.05)}
.gb:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--bd),0 4px 8px rgba(10,20,40,.2)}
.gb:disabled{filter:grayscale(.8);opacity:.5;cursor:not-allowed}
.gb.green{--b:var(--green);--bd:var(--green-dk);--t:#fff}.gb.red{--b:var(--red);--bd:var(--red-dk);--t:#fff}.gb.blue{--b:var(--blue);--bd:var(--blue-dk);--t:#fff}
.gb.green,.gb.red,.gb.blue{text-shadow:0 2px 0 rgba(0,0,0,.18)}
.gb.white{--b:#fff;--bd:var(--line2);--t:var(--ink)}
.gb.xl{font-size:26px;padding:16px 32px;border-radius:var(--r-lg)}
.gb.sm{font-size:16px;padding:9px 15px;border-radius:var(--r-sm);box-shadow:0 4px 0 var(--bd),0 6px 12px rgba(10,20,40,.16)}
.gb.xs{font-size:13px;padding:7px 10px;border-radius:var(--r-xs);box-shadow:0 3px 0 var(--bd)}
.gb kbd{font-family:var(--body);font-weight:900;font-size:var(--t-xs);letter-spacing:.04em;text-transform:none;background:rgba(20,33,61,.14);border-radius:6px;padding:3px 6px}
.gb.green kbd,.gb.red kbd,.gb.blue kbd{background:rgba(255,255,255,.25)}
.x{display:grid;place-items:center;width:42px;height:42px;border-radius:var(--r-sm);border:0;background:var(--ink);color:#fff;flex:none;box-shadow:0 3px 0 #000;padding:0}
.x .i{width:20px;height:20px;stroke-width:3}
.ib{display:grid;place-items:center;width:42px;height:42px;border-radius:var(--r-sm);padding:0}
.ib .i{width:22px;height:22px}
.ib:hover,.tool:hover{background:var(--glass2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:var(--t-sm);padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap}
.chip .i{width:15px;height:15px}
.chip.hot{background:var(--red);border-color:rgba(255,255,255,.35)}
.tool{display:inline-flex;align-items:center;gap:var(--sp-2);font-weight:900;font-size:14px;padding:9px 14px;border-radius:var(--r-md)}
.tool .i{width:18px;height:18px}
.tool .c{background:var(--yellow);color:var(--ink);border-radius:var(--r-pill);font-size:12px;padding:1px 7px}
.tool:disabled{opacity:.45;cursor:not-allowed}

/* ---------- logo, avatars, pièces ---------- */
.logo{display:inline-grid;justify-items:center;font-family:var(--display);color:#fff;line-height:.95;text-transform:uppercase;letter-spacing:.02em;
  background:linear-gradient(#FF6A4D,var(--red));border-radius:.28em;padding:.14em .5em .2em;border:.09em solid #fff;
  text-shadow:0 .06em 0 rgba(0,0,0,.22);box-shadow:0 .14em 0 var(--red-dk),0 .3em .7em rgba(0,0,0,.25);transform:rotate(-2deg)}
.logo small{font-size:.3em;opacity:.95;margin-bottom:.15em;letter-spacing:.2em}
.av{--pc:#888;width:56px;height:56px;border-radius:50%;background:#fff;color:var(--pc);display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 0 0 3px var(--pc)}
.av svg{width:64%;height:64%}
.av.s{width:34px;height:34px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 0 0 2px var(--pc)}
.av.m{width:44px;height:44px}
.av.l{width:84px;height:84px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),0 0 0 4px var(--pc)}
.avb{border:0;background:none;padding:0;border-radius:50%;cursor:pointer;transition:transform .15s}.avb:hover{transform:scale(1.08) rotate(-6deg)}
.cdot{width:30px;height:30px;border-radius:50%;flex:none;border:4px solid #fff;background:var(--dc);box-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}.cdot:hover{transform:scale(1.1)}
.coin{display:inline-grid;place-items:center;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC531 45%,#D99200);
  color:#8A5A00;font-family:var(--body);font-weight:900;font-size:.8em;box-shadow:0 .08em 0 #A86D00;flex:none}
.coin::before{content:"€";font-size:.62em}

/* ---------- accueil ---------- */
#home{position:fixed;inset:0;overflow-y:auto;display:grid;justify-items:center;align-content:start;padding:clamp(20px,6vh,64px) 16px 220px;gap:var(--sp-5)}
.skyline{position:fixed;left:0;right:0;bottom:0;height:min(34vh,300px);pointer-events:none;z-index:-1}
.skyline svg{width:100%;height:100%;display:block}
.cloud{position:fixed;width:180px;height:56px;border-radius:var(--r-pill);background:rgba(255,255,255,.85);z-index:-1;filter:blur(1px);animation:drift 60s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:80px;height:80px;left:30px;top:-38px}.cloud::after{width:60px;height:60px;left:90px;top:-26px}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.hero{display:grid;justify-items:center;gap:var(--sp-3);text-align:center}
.hero .logo{font-size:clamp(44px,9vw,84px)}
.hero p{margin:0;font-weight:800;max-width:44ch;line-height:1.45;background:rgba(255,255,255,.72);padding:8px 14px;border-radius:var(--r-sm)}
.card{width:min(520px,100%);padding:20px;display:grid;gap:var(--sp-3)}
.card h2,.sh h2{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.02em;display:flex;align-items:center;gap:var(--sp-3);line-height:1.05}
.card h2{font-size:var(--h-md)}
.card h2 .n{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-xs);background:var(--ink);color:#fff;font-size:17px}
.card h2 .note{font-family:var(--body)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>input{flex:1 1 140px}
.pseudo{display:flex;align-items:center;gap:var(--sp-3)}
.pseudo input{flex:1;font-size:18px}
.code{font-family:var(--display);font-size:52px;letter-spacing:.2em;padding:4px 16px 4px 26px;border-color:var(--yellow);border-width:3px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pslots{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-md);background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 72%,#fff),var(--pc));color:#fff;border:3px solid #fff;
  box-shadow:0 4px 0 color-mix(in srgb,var(--pc) 60%,#000);font-family:var(--display);font-size:var(--h-sm);min-width:0;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.slot span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.slot small{display:block;opacity:.9;text-shadow:none}
.slot.empty{background:rgba(255,255,255,.55);color:var(--muted);border:3px dashed var(--line2);box-shadow:none;text-shadow:none;font-size:var(--h-xs)}
.slot input{width:100%;font-family:var(--display);font-size:17px;padding:6px 8px;border-width:2px}
.slot .x{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.22);box-shadow:none}.slot .x .i{width:14px;height:14px}
.slot.mine{outline:3px solid var(--yellow);outline-offset:2px}
.slot .rdy{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-family:var(--body);font-weight:900;font-size:var(--t-xs);background:rgba(0,0,0,.25);border-radius:var(--r-pill);padding:3px 8px;white-space:nowrap;text-shadow:none}
.slot .rdy.ok{background:#fff;color:var(--green-dk)}.slot .rdy .i{width:12px;height:12px;stroke-width:3.4}
.opts{display:grid;gap:var(--sp-3)}
.opt{display:grid;gap:6px}
.opt>span{font-weight:900;font-size:14px}.opt small{display:block;color:var(--muted);letter-spacing:.04em;text-transform:none;font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 12px;font-weight:900;font-size:var(--t-sm);border-radius:var(--r-sm)}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.seg button:disabled{cursor:default;opacity:.85}

/* ---------- scène ---------- */
#game{position:fixed;inset:0}
#stage{position:absolute;inset:0;overflow:hidden}
#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.hud>.tags,.hud>.banner,.hud>.feed,.hud>.plates{pointer-events:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-weight:800;padding:20px;text-align:center}

/* plaques joueurs */
.plates{position:absolute;inset:0}
.plate{--pc:#888;position:absolute;width:248px;display:grid;grid-template-columns:auto 1fr;gap:var(--sp-3);align-items:center;padding:10px 14px 10px 10px;border-radius:var(--r-lg);color:#fff;pointer-events:auto;cursor:pointer;
  background:linear-gradient(155deg,color-mix(in srgb,var(--pc) 66%,#fff),var(--pc) 60%,color-mix(in srgb,var(--pc) 85%,#000));border:3px solid #fff;
  box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 55%,#000),0 12px 26px rgba(10,20,40,.28);transition:transform .25s var(--spring),opacity .3s,filter .3s}
.plate:hover{filter:brightness(1.04)}
.plate.k0{left:16px;top:16px}.plate.k1{right:16px;top:16px}.plate.k2{left:16px;bottom:16px}.plate.k3{right:16px;bottom:16px}
.plate.k4{left:16px;top:50%;margin-top:-46px}.plate.k5{right:16px;top:50%;margin-top:-46px}
.plate .pi{display:grid;gap:3px;min-width:0}
.plate .pn{font-family:var(--display);font-size:20px;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .pm{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:27px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.28);font-variant-numeric:tabular-nums}
.plate .pm.neg{color:#FFE0DC}
.plate .pg{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;min-height:22px;align-items:center}
.plate .none{font-size:var(--t-xs);font-weight:800;opacity:.85}
.gcd{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:27px;height:22px;padding:5px 4px 0;border-radius:5px;background:#fff;color:var(--ink);font-weight:900;font-size:10.5px;line-height:1;
  box-shadow:inset 0 6px 0 var(--gc),0 2px 0 rgba(0,0,0,.22);text-shadow:none}
.gcd.full{box-shadow:inset 0 6px 0 var(--gc),0 0 0 2px var(--yellow),0 2px 0 rgba(0,0,0,.22)}
.gcd.gare{padding:0 5px;box-shadow:inset 0 0 0 2px var(--gc),0 2px 0 rgba(0,0,0,.22)}.gcd .i{width:12px;height:12px;stroke-width:2.8}
.gcd em.ht{background:var(--red)}
.gcd em{position:absolute;top:-7px;right:-6px;font-style:normal;background:var(--green);color:#fff;border:2px solid #fff;border-radius:var(--r-pill);font-size:9px;padding:1px 4px}
.plate .rank{position:absolute;top:-12px;left:-10px;font-family:var(--display);font-size:18px;line-height:1;padding:5px 8px 6px;border-radius:var(--r-sm);border:3px solid #fff;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.plate .rank.r1{background:linear-gradient(#FFE680,#FFC107)}.plate .rank.r2{background:linear-gradient(#F4F7FA,#C5D0DC)}.plate .rank.r3{background:linear-gradient(#F7C9A0,#D9884A)}
.plate .rank.bump{animation:rkup .7s cubic-bezier(.3,1.8,.5,1)}.plate .rank.down{animation:rkdn .6s ease}
@keyframes rkup{40%{transform:scale(1.6) rotate(-8deg)}}
@keyframes rkdn{30%{transform:translateY(5px) scale(.85)}}
.plate .bdg{display:flex;gap:4px;flex-wrap:wrap}
.plate .bdg span{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.28);border-radius:var(--r-pill);padding:2px 7px}
.plate .me{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:13px;background:var(--ink);color:#fff;border:2px solid #fff;border-radius:var(--r-pill);padding:2px 10px;letter-spacing:.06em}
.plate .flag{position:absolute;top:-14px;right:12px;font-family:var(--display);font-size:15px;letter-spacing:.06em;background:var(--yellow);color:var(--ink);border:3px solid #fff;border-radius:var(--r-pill);padding:3px 11px;box-shadow:0 3px 0 var(--yellow-dk);display:none}
.plate.cur{transform:scale(1.07);z-index:2;animation:glow 1.6s ease-in-out infinite}
.plate.cur .flag{display:block;animation:bob 1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 55%,#000),0 0 0 0 rgba(255,210,63,0),0 12px 26px rgba(10,20,40,.28)}50%{box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 55%,#000),0 0 0 7px rgba(255,210,63,.55),0 12px 26px rgba(10,20,40,.28)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.plate.out{filter:grayscale(.95);opacity:.62}
.delta{position:absolute;right:10px;top:-8px;font-family:var(--display);font-size:26px;pointer-events:none;-webkit-text-stroke:1.5px #fff;paint-order:stroke;text-shadow:0 3px 0 rgba(0,0,0,.25);animation:up 1.6s ease-out forwards}
.delta.p{color:var(--green)}.delta.m{color:var(--red)}
@keyframes up{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(-4px) scale(1.15)}30%{transform:translateY(-8px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}

/* barre du haut, menu */
.topc{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:var(--sp-2)}
.topc .logo{font-size:20px;margin-right:var(--sp-1);white-space:nowrap}
.menu{position:absolute;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:270px;padding:var(--sp-3);display:grid;gap:var(--sp-2);z-index:5;animation:rise .25s var(--spring)}
.menu .gb{width:100%;justify-content:flex-start}
.menu p{margin:var(--sp-1) var(--sp-1) 0;color:var(--muted)}

/* fil d'événements */
.feed{position:absolute;top:calc(68px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;gap:5px;justify-items:center;width:min(520px,calc(100% - 560px))}
.feed>div{display:flex;align-items:center;gap:var(--sp-2);font-weight:800;font-size:var(--t-sm);padding:4px 14px 4px 4px;border-radius:var(--r-pill);max-width:100%}
.feed>div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed>div:nth-last-child(2){opacity:.75}.feed>div:nth-last-child(3){opacity:.5}
.feed>div.new{animation:pop .5s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}

/* barre d'action */
.dock{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(600px,calc(100% - 560px));min-width:360px;display:grid;gap:10px;justify-items:center}
.prompt{width:100%;padding:14px 16px;display:grid;gap:var(--sp-3);animation:rise .35s var(--spring)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.noanim .prompt,.noanim .deed{animation:none}
.prompt .hd{display:flex;align-items:center;gap:var(--sp-3);min-width:0}
.prompt .tt{font-family:var(--display);font-size:24px;line-height:1.05;letter-spacing:.01em}
.prompt .st{font-weight:800;color:var(--ink2);font-size:14px;line-height:1.35;margin-top:2px}
.prompt .st b{color:var(--ink)}
.prompt .bt{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.prompt.one{grid-template-columns:1fr auto;align-items:center}.prompt.one .bt{justify-content:flex-end}
.prompt.warn{background:#FFF1EF}
.prompt.wait .tt::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.tb{display:flex;gap:var(--sp-2);justify-content:center;flex-wrap:wrap}
.mdeed{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-3);align-items:center;padding:var(--sp-2)}
.mdeed .mh{width:104px;height:62px;border-radius:var(--r-sm);background:var(--gc);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:12px;text-align:center;padding:4px;line-height:1.05;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.mdeed .mh.dk{color:var(--ink);text-shadow:none}
.mdeed b{font-family:var(--display);font-weight:400;font-size:20px;display:block;line-height:1.1}
.mdeed span{font-size:var(--t-sm);font-weight:800;color:var(--muted)}
.bid{font-family:var(--display);font-size:44px;line-height:1;display:flex;align-items:center;gap:10px;justify-content:center}
.bidders{display:flex;gap:var(--sp-2);justify-content:center;flex-wrap:wrap}
.bidder{display:grid;justify-items:center;gap:2px;padding:6px 8px;min-width:72px;transition:transform .2s}
.bidder span{font-weight:900;font-size:12.5px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bidder small{color:var(--muted);letter-spacing:.04em}
.bidder.on{border-color:var(--yellow);transform:translateY(-4px) scale(1.06);box-shadow:0 4px 0 var(--yellow-dk)}
.bidder.lead small{color:var(--green-dk)}
.bidder.gone{opacity:.4;filter:grayscale(1)}
.timer{width:100%;height:10px;border-radius:var(--r-pill);background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow) 60%,var(--red));animation:tm linear forwards;transform-origin:left}
@keyframes tm{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* fenêtres */
.modal{position:absolute;inset:0;background:rgba(10,16,32,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:grid;place-items:center;padding:var(--sp-4);z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(820px,100%);max-height:min(86vh,100%);overflow:auto;animation:rise .3s var(--spring)}
.sheet.narrow{width:min(520px,100%)}
.sh{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:16px 18px 12px;background:var(--cream);border-bottom:2px solid var(--line)}
.sh h2{font-size:var(--h-lg)}.sh h2 .i.h{width:30px;height:30px}
.sb{padding:16px 18px 20px;display:grid;gap:var(--sp-4)}
.ptabs,.who{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.ptab{display:flex;align-items:center;gap:var(--sp-2);border-radius:var(--r-pill);padding:4px 14px 4px 4px;font-weight:900}
.ptab[aria-pressed=true]{background:var(--pc);border-color:var(--pc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--pc) 55%,#000)}
.sumline{font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--sp-3)}
.pc{overflow:hidden;display:grid}
.pc.mort{filter:saturate(.3);opacity:.85}
.pc .ph{background:var(--gc);color:#fff;padding:9px 10px 8px;font-family:var(--display);font-size:17px;line-height:1.05;min-height:52px;display:grid;align-content:center;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.pc .ph.dk{color:var(--ink);text-shadow:none}
.pc .ph small{opacity:.9}
.pc .pb{padding:9px 10px 10px;display:grid;gap:var(--sp-2)}
.pc .hs{display:flex;gap:3px;min-height:18px;align-items:center;font-size:12.5px;font-weight:800;color:var(--muted)}
.pc .hs i{width:15px;height:13px;background:#2BAA5E;clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.pc .hs i.h{width:22px;background:var(--red)}
.pc .rn{display:flex;justify-content:space-between;font-size:var(--t-sm);font-weight:800;color:var(--muted)}
.pc .rn b{color:var(--ink);font-weight:900}
.pc .pa{display:flex;gap:6px;flex-wrap:wrap}
.pc .pa .gb{font-size:12.5px;padding:6px 9px}
.star{display:inline-flex;align-items:center;gap:4px;color:#D99200;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.star .i{width:13px;height:13px;fill:currentColor}
.emptybox{padding:26px;text-align:center;font-weight:800;color:var(--muted);border-style:dashed;box-shadow:none}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcol{padding:var(--sp-3);display:grid;gap:10px;align-content:start}
.tcol h3,.offerbox .side b{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:400;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-sm);padding:5px 9px 5px 5px;font-weight:800;font-size:var(--t-sm);text-align:left;box-shadow:none}
.tchip i{width:8px;align-self:stretch;min-height:18px;border-radius:4px;background:var(--gc)}
.tchip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:100px;text-align:center;font-family:var(--display);font-size:20px;padding:6px}
.stepper label{font-weight:900;font-size:var(--t-sm);color:var(--muted)}
.offerbox{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-3);align-items:center}
.offerbox .side{padding:var(--sp-3);display:grid;gap:var(--sp-2);justify-items:center;text-align:center}
.offerbox .arrow{color:var(--muted)}.offerbox .arrow .i{width:32px;height:32px}
.loglist{margin:0;padding:0;list-style:none;display:grid;gap:var(--sp-2)}
.loglist li{display:flex;align-items:center;gap:10px;padding:9px 12px;font-weight:800;box-shadow:none}
.loglist li:last-child{border-color:var(--yellow)}
/* fin de partie */
.results{text-align:center}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:var(--sp-3);padding:10px 6px 0}
.pod{display:grid;justify-items:center;gap:var(--sp-2)}
.pod .nm{font-family:var(--display);font-size:20px}
.pod .wv{font-weight:900;color:var(--muted);display:flex;gap:6px;align-items:center}
.pod .blk{width:100%;border-radius:var(--r-md) var(--r-md) 0 0;display:grid;place-items:center;font-family:var(--display);color:#fff;font-size:var(--h-xl);text-shadow:0 3px 0 rgba(0,0,0,.25);border:3px solid #fff;border-bottom:0}
.pod.r1 .blk{height:150px;background:linear-gradient(#FFE680,#F5B700)}.pod.r2 .blk{height:110px;background:linear-gradient(#F4F7FA,#AEBBCB)}.pod.r3 .blk{height:80px;background:linear-gradient(#F7C9A0,#C8743A)}
.pod.r1 .av{animation:bob 1s ease-in-out infinite}
.crown{color:#F5B700;margin-bottom:-6px;filter:drop-shadow(0 2px 0 #B07A00)}.crown .i{width:34px;height:34px;fill:#FFD23F;stroke:#B07A00;stroke-width:2}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:12px 10px;display:grid;justify-items:center;gap:3px;text-align:center}
.stat .fi{width:32px;height:32px}.stat .fi .i{width:18px;height:18px}
.stat small{color:var(--muted)}
.stat b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.stat>span:last-child{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.ar{width:14px;height:14px;stroke-width:3}
/* passage du PC */
.modal.clear{background:radial-gradient(circle,rgba(20,33,61,.25),rgba(10,16,32,.72))}
.pass{display:grid;place-items:center;width:100%;height:100%}
.pcard{display:grid;justify-items:center;gap:var(--sp-2);background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc));color:#fff;padding:28px 40px 30px;text-align:center;
  box-shadow:0 10px 0 color-mix(in srgb,var(--pc) 55%,#000),0 30px 60px rgba(0,0,0,.4);animation:rise .45s var(--spring)}
.pcard b{font-family:var(--display);font-weight:400;font-size:52px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.pcard p{margin:0 0 8px;font-weight:800}
.pcard .av{animation:bob 1s ease-in-out infinite}
/* règles */
.rulesov{position:fixed;z-index:60}
.rcard{display:grid;justify-items:center;gap:var(--sp-2);text-align:center;padding:22px 20px;border-top:12px solid var(--rc);animation:rise .35s var(--spring)}
.rcard .ri{width:120px;height:120px;border-radius:50%;background:color-mix(in srgb,var(--rc) 22%,#fff);display:grid;place-items:center}.rcard .ri svg{width:86px;height:86px}
.rcard small{color:var(--muted)}
.rcard>b{font-family:var(--display);font-weight:400;font-size:var(--h-lg);line-height:1.05}
.rcard p{margin:0;font-weight:700;line-height:1.5;font-size:15.5px;max-width:40ch}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--ink);width:24px;border-radius:var(--r-pill)}

/* ---------- surimpressions ---------- */
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(44px,8vw,96px);color:var(--yellow);letter-spacing:.03em;white-space:nowrap;
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink),0 16px 30px rgba(0,0,0,.4);text-transform:uppercase}
.banner.go{animation:bn 1.8s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}24%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05) rotate(-2deg)}}
.tags{position:absolute;left:0;top:0;width:0;height:0}
.ptag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:2px 9px 2px 3px;font-weight:900;font-size:12px;white-space:nowrap;will-change:transform;background:var(--glass2)}
.ptag.cur{background:var(--yellow);color:var(--ink);border-color:#fff;box-shadow:0 3px 0 var(--yellow-dk)}
.ptag .dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.seat{display:none!important}
.coin.fly{position:absolute;left:-11px;top:-11px;width:22px;height:22px;font-size:22px;z-index:9;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.flylabel{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);font-weight:900;font-size:14px;padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap;z-index:9;pointer-events:none;
  border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.2),0 8px 18px rgba(0,0,0,.25);animation:flab 1.9s ease-out forwards}
.flylabel .ar{color:var(--green-dk)}
@keyframes flab{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
/* grande carte */
.cardpop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,16,32,.35);z-index:8;padding:var(--sp-4);animation:fade .25s}
.bigcard{width:min(420px,92vw);background:var(--paper);border-radius:28px;overflow:hidden;text-align:center;border:5px solid #fff;box-shadow:var(--sh-panel),0 30px 70px rgba(0,0,0,.3);animation:flipin .7s var(--spring);position:relative}
@keyframes flipin{0%{transform:perspective(900px) rotateY(95deg) scale(.6);opacity:0}60%{opacity:1}}
.bigcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.65) 48%,transparent 60%);transform:translateX(-120%);animation:shine 1.4s .6s ease-out forwards;pointer-events:none}
@keyframes shine{to{transform:translateX(120%)}}
.bigcard .bh{padding:22px 16px 18px;color:#fff;display:grid;justify-items:center;gap:6px}
.bigcard.ch .bh{background:radial-gradient(circle at 50% 0,#FFC46B,#FF8A00 55%,#E86A00)}.bigcard.cc .bh{background:radial-gradient(circle at 50% 0,#7CC8FF,#2F86F0 55%,#1F5FC4)}
.bigcard .bi{width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.22);border:4px solid #fff;display:grid;place-items:center;font-family:var(--display);font-size:58px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.bigcard .bi .i{width:50px;height:50px;stroke-width:2.2}
.bigcard .bh b{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.bigcard p{margin:0;padding:22px 24px 6px;font-weight:800;font-size:19px;line-height:1.4}
.bigcard .gb{margin:14px auto 22px}
/* fiche de case */
.deedpop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:end;gap:var(--sp-2);z-index:4}
.deedpop .x{position:absolute;top:-14px;right:-14px;z-index:1}
.deed{width:min(330px,82vw);background:var(--paper);color:var(--ink);border-radius:var(--r-lg);overflow:hidden;font-size:14.5px;border:var(--edge);box-shadow:var(--sh-panel);animation:rise .3s var(--spring)}
.dh{background:var(--gc);background-image:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 60%);color:#fff;text-align:center;padding:14px 10px}
.dh.dk{color:var(--ink)}
.dh small{display:block;opacity:.9}
.dh strong{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05}
.db{padding:10px 16px 14px;display:grid;gap:var(--sp-2)}
.deed table{color:inherit;font:inherit;width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.deed td{padding:4px 0;border-bottom:2px solid var(--line);font-weight:700}
.deed td:last-child{text-align:right;font-weight:900}
.dn{margin:0;text-align:center;color:var(--muted);font-weight:700;font-size:var(--t-sm)}
.dn b{color:var(--ink)}
.dacts{display:flex;gap:var(--sp-2);flex-wrap:wrap;justify-content:center;width:min(330px,82vw)}
/* dés HTML (si pas de 3D) */
.dice{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;gap:var(--sp-3);pointer-events:none}
.die{width:58px;height:58px;background:linear-gradient(#fff,#EDEFF4);border-radius:var(--r-sm);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:0 5px 0 #B8C0CC,0 10px 18px rgba(0,0,0,.25)}
.die i{width:72%;height:72%;border-radius:50%;background:var(--ink);place-self:center}
.dice.roll .die{animation:wob .45s ease-out}
@keyframes wob{0%{transform:rotate(-25deg) scale(.8)}60%{transform:rotate(12deg) scale(1.08)}}
.photobar{display:none;position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);gap:var(--sp-2);align-items:center;padding:8px 10px 8px 16px;border-radius:var(--r-pill);font-size:var(--t-sm);font-weight:800;white-space:nowrap}
body.photo .hud>*{display:none!important}body.photo .hud>.photobar{display:flex!important}
.toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--glass2);font-weight:900;padding:12px 18px;border-radius:var(--r-md);z-index:70;max-width:calc(100vw - 40px);animation:pop .35s var(--spring)}
/* chargement */
.loading{position:absolute;inset:0;z-index:40;display:grid;place-content:center;justify-items:center;gap:22px;background:linear-gradient(#4FB3EE,#BFE6FF);transition:opacity .5s}
.loading.done{opacity:0;pointer-events:none}
.loading .logo{font-size:clamp(40px,8vw,72px);animation:bob 1.6s ease-in-out infinite}
.lbar{width:min(360px,80vw);height:18px;border-radius:var(--r-pill);background:rgba(255,255,255,.6);border:3px solid #fff;overflow:hidden;box-shadow:0 4px 0 rgba(20,33,61,.15)}
.lbar i{display:block;height:100%;width:4%;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#FFE27A 14px 28px);background-size:40px 40px;animation:stripes .8s linear infinite;border-radius:var(--r-pill)}
@keyframes stripes{to{background-position:40px 0}}
.loading p{margin:0;font-weight:900;background:rgba(255,255,255,.72);padding:6px 14px;border-radius:var(--r-pill)}
/* intro */
#skipintro{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none}
body.intro #skipintro{display:inline-flex;animation:rise .4s}
.plates,.dock,.topc,.feed{transition:opacity .6s,transform .6s}
body.intro .plates,body.intro .dock,body.intro .topc,body.intro .feed{opacity:0;pointer-events:none}
body.intro .plate{pointer-events:none}


/* ---------- écran titre, menu principal ---------- */
#home{z-index:20}
body.menu3d{background:#0E1830}
body.menu3d #home{background:radial-gradient(ellipse at 50% 40%,rgba(10,20,40,0) 30%,rgba(10,20,40,.55) 100%)}
body.menu3d .hud,body.menu3d .nogl{display:none}
#home.fadein>*{animation:rise .45s var(--spring) both}#home.fadein>*:nth-child(2){animation-delay:.08s}
.title{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:44px;cursor:pointer;text-align:center;padding:16px;outline:none}
.tlogo{font-size:clamp(52px,11vw,124px);animation:tlogo 1s var(--spring) both,bob 3s 1s ease-in-out infinite}
@keyframes tlogo{from{opacity:0;transform:translateY(-60px) scale(.6) rotate(-8deg)}to{opacity:1;transform:rotate(-2deg)}}
.press{font-family:var(--display);font-size:clamp(24px,3.4vw,36px);letter-spacing:.06em;text-transform:uppercase;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--ink);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.96)}}
.tfoot{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:0;color:rgba(255,255,255,.85);font-weight:800;font-size:var(--t-sm);text-shadow:0 1px 3px rgba(0,0,0,.5)}
body.no3d .press{color:var(--yellow)}body.no3d .tfoot{color:var(--ink);text-shadow:none}
.mlogo{font-size:clamp(40px,7vw,64px)}
.mainmenu{width:min(560px,100%)}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.mmb{--b:var(--green);--bd:var(--green-dk);display:grid;justify-items:start;gap:4px;text-align:left;border:0;border-radius:var(--r-lg);padding:16px 16px 14px;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--b) 75%,#fff),var(--b) 60%);box-shadow:0 6px 0 var(--bd),0 12px 22px rgba(10,20,40,.22);transition:transform .1s,box-shadow .1s,filter .15s;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.mmb.blue{--b:var(--blue);--bd:var(--blue-dk)}
.mmb:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-2px)}.mmb:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--bd)}
.mmb:disabled{filter:grayscale(.9);opacity:.55;cursor:not-allowed}
.mmb .mi{display:grid;place-items:center;width:46px;height:46px;border-radius:var(--r-sm);background:rgba(255,255,255,.22);margin-bottom:4px}.mmb .mi .i{width:28px;height:28px}
.mmb b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.mmb small{font-weight:800;font-size:var(--t-sm);opacity:.92;text-shadow:none}
.join{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;background:var(--paper);border:2px solid var(--line);border-radius:var(--r-md);padding:8px 8px 8px 14px}
.join span{flex:1 1 150px;font-weight:900;font-size:var(--t-sm);color:var(--ink2)}
.join input{width:120px;text-transform:uppercase;font-family:var(--display);font-size:20px;letter-spacing:.2em;text-align:center;padding:6px}
.mmfoot{justify-content:center}
/* ---------- menu pause ---------- */
.ovl{position:fixed;z-index:55;background:rgba(10,16,32,.62)}
.pause{display:grid;justify-items:center;gap:var(--sp-4);width:min(400px,100%);animation:rise .3s var(--spring)}
.ptitle{font-size:clamp(48px,8vw,72px)}
.pbtns{display:grid;gap:var(--sp-3);width:100%}.pbtns .gb{width:100%}
.pnote{margin:0;color:rgba(255,255,255,.85);font-weight:800;font-size:var(--t-sm);text-align:center}
/* ---------- réglages ---------- */
.setlist{gap:var(--sp-3)}
.set{display:grid;gap:var(--sp-2);background:var(--paper);border:2px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.set>span{display:flex;align-items:center;gap:var(--sp-2);font-weight:900;flex-wrap:wrap}.set>span .i{color:var(--blue-dk)}
.set>span small{flex-basis:100%;font-weight:700;color:var(--muted);font-size:12px;padding-left:26px}
.rng{display:flex;align-items:center;gap:var(--sp-3)}
.rng b{font-family:var(--display);font-weight:400;font-size:18px;min-width:34px;text-align:right}
.rng input{flex:1;-webkit-appearance:none;appearance:none;height:14px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--green),var(--yellow));box-shadow:inset 0 2px 0 rgba(0,0,0,.12);outline:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:grab}
.rng input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--ink);cursor:grab}
.rng input:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
/* ---------- fin de partie ---------- */
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:65}
.wintitle{font-size:44px;justify-self:center;animation:tlogo .8s var(--spring) both}
.podium .pod{animation:podin .55s var(--spring) both}.podium .pod .blk{transform-origin:bottom;animation:grow .6s var(--spring) both}
.podium .pod.r3,.podium .pod.r3 .blk{animation-delay:.5s}.podium .pod.r2,.podium .pod.r2 .blk{animation-delay:1.1s}.podium .pod.r1,.podium .pod.r1 .blk{animation-delay:1.8s}
.podium .pod.r1 .av{animation:bob 1s 2.6s ease-in-out infinite}
@keyframes podin{from{opacity:0;transform:translateY(-40px)}}
@keyframes grow{from{transform:scaleY(0)}}
.results .stats{animation:rise .5s 2.6s var(--spring) both}.results .endbtns{animation:rise .5s 3s var(--spring) both;justify-content:center}
@media (max-width:860px){.mm{grid-template-columns:1fr}.mmb{grid-template-columns:auto 1fr;align-items:center;column-gap:12px}.mmb .mi{grid-row:span 2;margin:0}.wintitle{font-size:30px}}

/* ---------- liens interface ↔ 3D ---------- */
[data-hsq]{cursor:default}.pc[data-hsq]:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--line2),0 0 0 3px var(--yellow)}.pc{transition:transform .15s,box-shadow .15s}
.tchip[data-hsq]:hover{border-color:var(--yellow)}.mdeed[data-hsq]:hover{border-color:var(--yellow)}
.modal.dockr{place-items:stretch end;background:linear-gradient(90deg,rgba(10,16,32,0) 35%,rgba(10,16,32,.42));-webkit-backdrop-filter:none;backdrop-filter:none}
.modal.dockr .sheet{width:min(560px,46vw);max-height:none;height:100%;animation:slidein .35s var(--spring)}
@keyframes slidein{from{opacity:0;transform:translateX(60px)}}
.modal.dockr .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.modal.dockr .trade{grid-template-columns:1fr}
.flycard{position:absolute;left:0;top:0;width:128px;border-radius:12px;overflow:hidden;background:#fff;border:3px solid #fff;z-index:12;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.35);will-change:transform}
.flycard .fh{background:var(--gc);color:#fff;font-family:var(--display);font-size:15px;line-height:1.05;padding:8px 8px 9px;text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.flycard .fh.dk{color:var(--ink);text-shadow:none}.flycard .fh small{display:block;font-family:var(--body);font-weight:900;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.flycard .fb{display:grid;gap:6px;padding:10px 10px 12px}.flycard .fb span{height:6px;border-radius:3px;background:var(--line)}.flycard .fb span:nth-child(2){width:70%}

/* ---------- moments forts ---------- */
.moment{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;animation:mom 3.4s ease-out forwards}
.moment .mr{display:flex;align-items:center;gap:var(--sp-3);background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 70%,#fff),var(--mc));color:#fff;border:4px solid #fff;border-radius:var(--r-lg);padding:14px 22px 14px 14px;
  box-shadow:0 7px 0 color-mix(in srgb,var(--mc) 55%,#000),0 20px 50px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,0,0,.22)}
.moment .mi{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid #fff;flex:none}.moment .mi .i{width:32px;height:32px}
.moment b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,32px);line-height:1.05;white-space:nowrap}
.moment small{display:block;font-weight:800;font-size:var(--t-md);opacity:.95;margin-top:3px}
@keyframes mom{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(1deg)}18%{transform:translate(-50%,-50%) scale(1) rotate(-1deg)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}
/* ---------- réactions ---------- */
.reacts{display:flex;gap:6px;justify-content:center;background:var(--glass2);border:2px solid var(--glass-edge);border-radius:var(--r-pill);padding:5px 8px;animation:pop .3s var(--spring)}
.reacts button{border:0;background:transparent;font-size:26px;line-height:1;width:44px;height:44px;border-radius:50%;transition:transform .15s}.reacts button:hover{transform:scale(1.25);background:rgba(255,255,255,.12)}
.react{position:absolute;bottom:60%;font-size:38px;pointer-events:none;z-index:3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));animation:reactup 2.6s ease-out forwards}
@keyframes reactup{0%{opacity:0;transform:translateY(20px) scale(.3)}12%{opacity:1;transform:translateY(-6px) scale(1.3)}22%{transform:translateY(-12px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(.9)}}
.plate .k2 .react,.plate.k2 .react,.plate.k3 .react{bottom:auto;top:-10px}
/* ---------- connexion ---------- */
.conn{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,16,32,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cbox{display:grid;justify-items:center;gap:var(--sp-2);text-align:center;width:min(380px,90vw);background:var(--cream);border:var(--edge);border-radius:var(--r-lg);box-shadow:var(--sh-panel);padding:24px 22px}
.cbox b{font-family:var(--display);font-weight:400;font-size:var(--h-lg)}.cbox small{font-weight:700;color:var(--ink2);line-height:1.45}
.spin{width:44px;height:44px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--yellow);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- astuces ---------- */
.tip{--ax:50%;position:absolute;left:0;top:0;z-index:9;width:260px;display:grid;gap:6px;background:var(--ink);color:#fff;border:3px solid var(--yellow);border-radius:var(--r-md);padding:12px 14px;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .25s var(--spring)}
.tip b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--yellow)}.tip span{font-weight:700;font-size:var(--t-sm);line-height:1.4}.tip .gb{justify-self:end}
.tip::after{content:"";position:absolute;left:calc(var(--ax) - 9px);bottom:-12px;border:9px solid transparent;border-top-color:var(--yellow);border-bottom:0}
.tip.below::after{bottom:auto;top:-12px;border-top:0;border-bottom:9px solid var(--yellow)}
.tip:not([hidden]){animation:pop .35s var(--spring)}
/* ---------- daltonisme : motifs ---------- */
body.cb .gcd{background-image:linear-gradient(var(--gc),var(--gc)),var(--gp);background-size:100% 6px,8px 8px;background-repeat:no-repeat,repeat;box-shadow:0 2px 0 rgba(0,0,0,.22)}
body.cb .gcd.gare{background-image:none;box-shadow:inset 0 0 0 2px var(--gc),0 2px 0 rgba(0,0,0,.22)}
body.cb .gcd.full{box-shadow:0 0 0 2px var(--yellow),0 2px 0 rgba(0,0,0,.22)}
body.cb .pc .ph,body.cb .mdeed .mh,body.cb .dh,body.cb .flycard .fh{background-image:var(--gp),linear-gradient(var(--gc),var(--gc))}
body.cb .tchip i{background-image:var(--gp),linear-gradient(var(--gc),var(--gc));width:12px}
/* ---------- focus clavier visible partout ---------- */
.plate:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.tool:focus-visible,.ib:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* ---------- photos de profil ---------- */
.av.ph{position:relative;overflow:visible;background:var(--pc)}
.av.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.ph .tk{position:absolute;right:-5px;bottom:-5px;width:44%;height:44%;min-width:16px;min-height:16px;border-radius:50%;background:#fff;color:var(--pc);display:grid;place-items:center;box-shadow:0 0 0 2px var(--pc),0 2px 0 rgba(0,0,0,.2)}
.av.ph .tk svg{width:70%;height:70%}
.av.s.ph .tk{right:-4px;bottom:-4px}
.tokb{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:#fff;color:var(--pc,var(--ink));display:grid;place-items:center;padding:5px;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.25);margin-left:-18px;margin-top:22px;z-index:1;transition:transform .15s}
.tokb:hover{transform:scale(1.12) rotate(-8deg)}.tokb svg{width:100%;height:100%}
.pseudo .tokb{--pc:var(--ink)}

<script>
const SITE=true,SITE_CFG=window.LGP_CONFIG||{};
/* ================= Version site (GitHub Pages) : connexion Discord + jeu en ligne PeerJS ================= */
/* ---------- connexion Discord (OAuth2, flux implicite, aucun serveur) ---------- */
const DISCORD=(()=>{const D={me:null};
  try{const v=JSON.parse(localStorage.getItem('lgp-discord'));if(v&&v.id&&v.name)D.me=v}catch(e){}
  const redirect=()=>location.origin+location.pathname;
  D.ready=!!(SITE_CFG.discordClientId&&/^\d{15,22}$/.test(SITE_CFG.discordClientId));
  D.login=()=>{if(!D.ready){toast('La connexion Discord n’est pas encore configurée (identifiant manquant dans config.js).');return}
    const st=Math.random().toString(36).slice(2);try{sessionStorage.setItem('lgp-oauth',st);const j=(location.hash.match(/join=([A-Za-z]{4})/)||[])[1];if(j)sessionStorage.setItem('lgp-join',j)}catch(e){}
    location.href=`https://discord.com/oauth2/authorize?client_id=${SITE_CFG.discordClientId}&response_type=token&redirect_uri=${encodeURIComponent(redirect())}&scope=identify&state=${st}`};
  D.logout=()=>{D.me=null;try{localStorage.removeItem('lgp-discord')}catch(e){}if(typeof homeView==='function')homeView()};
  // retour de Discord : #access_token=…&state=…
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){let ok=true;try{ok=h.get('state')===sessionStorage.getItem('lgp-oauth')}catch(e){}
    const tok=h.get('access_token'),type=h.get('token_type')||'Bearer';
    let join=null;try{join=sessionStorage.getItem('lgp-join');sessionStorage.removeItem('lgp-join')}catch(e){}
    history.replaceState(null,'',location.pathname+location.search+(join?'#join='+join:''));
    if(ok)D.pending=fetch('https://discord.com/api/v10/users/@me',{headers:{Authorization:`${type} ${tok}`}}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(u=>{
      const img=u.avatar?`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith('a_')?'gif':'png'}?size=128`:`https://cdn.discordapp.com/embed/avatars/${Number((BigInt(u.id)>>22n)%6n)}.png`;
      D.me={id:u.id,name:String(u.global_name||u.username||'Joueur').slice(0,16),img};try{localStorage.setItem('lgp-discord',JSON.stringify(D.me))}catch(e){}
      myName=D.me.name;LS.set('lgp-name',myName);LS.del('lgp-pfp');
      if(typeof toast==='function')toast(`Connecté à Discord : salut ${D.me.name} !`);if(typeof render==='function')render()}).catch(()=>{if(typeof toast==='function')toast('La connexion Discord a échoué, réessaie.')})}
  else if(h.get('error')){history.replaceState(null,'',location.pathname+location.search)}
  return D})();
const DISCORD_LOGO='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18a19.8 19.8 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2a19.7 19.7 0 0 0 6-3c.5-5.1-.8-9.6-3.6-13.6zM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.4 8 10.4s2.2 1.1 2.2 2.5-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.5 2.2-2.5 2.2 1.1 2.2 2.5-1 2.4-2.2 2.4z"/></svg>';
function discordBlock(){const me=DISCORD.me;
  return me?`<div class="dlog on"><span class="dl">${DISCORD_LOGO}</span><span class="dn2">Connecté avec Discord<b>${esc(me.name)}</b></span><button class="gb white xs" id="dlogout">Déconnexion</button></div>`
    :`<button class="dlog" id="dlogin" type="button"><span class="dl">${DISCORD_LOGO}</span><span class="dn2">Se connecter avec Discord<small>Ton pseudo et ta photo Discord, automatiquement</small></span></button>`}

/* ---------- jeu en ligne : salons PeerJS (même interface que la capacité room de claude.ai) ---------- */
const NETROOM=(()=>{
  const PREFIX='lgp-grandparis-';
  async function join(name){
    const host=isHost,hid=PREFIX+name.replace(/[^a-z0-9-]/g,'');
    const peer=new Peer(host?hid:undefined,{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}});
    await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('timeout')),12000);peer.on('open',()=>{clearTimeout(t);res()});peer.on('error',e=>{clearTimeout(t);rej(e)})});
    const me=peer.id,handlers={},peerFns=[],connFns=[];let conns=new Map(),hostConn=null,connected=true,left=false;
    let list=new Map([[me,{presence:{},t:Date.now()}]]),snap=[];
    const build=()=>{snap=Object.freeze([...list.entries()].map(([id,v])=>Object.freeze({peer:id,by:null,isMe:id===me,sameTab:id===me,kind:'viewer',guest:false,presence:Object.freeze({...v.presence}),updatedAt:v.t})))};build();
    const notify=(old)=>{const prev=new Map(old.map(p=>[p.peer,p]));build();const now=new Map(snap.map(p=>[p.peer,p]));
      const ch={peers:snap,joined:snap.filter(p=>!prev.has(p.peer)),left:old.filter(p=>!now.has(p.peer)),updated:snap.filter(p=>prev.has(p.peer)&&JSON.stringify(prev.get(p.peer).presence)!==JSON.stringify(p.presence))};
      if(ch.joined.length||ch.left.length||ch.updated.length)peerFns.forEach(f=>{try{f(ch)}catch(e){console.error(e)}})};
    const setConn=c=>{if(connected===c)return;connected=c;connFns.forEach(f=>{try{f(c)}catch(e){}})};
    const deliver=(topic,data,from)=>{(handlers[topic]||[]).forEach(f=>{try{f({topic,data,peer:from,by:null,isMe:from===me,sameTab:from===me,kind:'viewer',guest:false})}catch(e){console.error(e)}})};
    // --- hôte : il tient la liste et relaie tout ---
    const hostSendList=()=>{const L=[...list.entries()].map(([id,v])=>[id,v.presence]);conns.forEach(c=>{try{c.send({k:'peers',L})}catch(e){}})};
    const hostEmit=(topic,data,from)=>{deliver(topic,data,from);conns.forEach(c=>{try{c.send({k:'msg',topic,data,from})}catch(e){}})};
    if(host){peer.on('connection',c=>{c.on('open',()=>{conns.set(c.peer,c);const old=snap;list.set(c.peer,{presence:{},t:Date.now()});notify(old);hostSendList()});
        c.on('data',m=>{if(!m||typeof m!=='object')return;
          if(m.k==='pres'&&m.p&&typeof m.p==='object'&&JSON.stringify(m.p).length<6000){const old=snap,e=list.get(c.peer)||{presence:{}};list.set(c.peer,{presence:m.p,t:Date.now()});notify(old);hostSendList()}
          else if(m.k==='emit'&&typeof m.topic==='string'&&JSON.stringify(m.data||null).length<8000)hostEmit(m.topic,m.data,c.peer)});
        const gone=()=>{if(!conns.has(c.peer))return;conns.delete(c.peer);const old=snap;list.delete(c.peer);notify(old);hostSendList()};c.on('close',gone);c.on('error',gone)});
      peer.on('disconnected',()=>{if(!left)setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)})}
    // --- invité : une connexion vers l'hôte, reconnexion automatique ---
    else{const connect=()=>{if(left)return;const c=peer.connect(hid,{reliable:true});let opened=false;
        c.on('open',()=>{opened=true;hostConn=c;setConn(true);c.send({k:'pres',p:list.get(me).presence})});
        c.on('data',m=>{if(!m||typeof m!=='object')return;
          if(m.k==='peers'&&Array.isArray(m.L)){const old=snap,mine=list.get(me);list=new Map(m.L.map(([id,p])=>[id,{presence:id===me?mine.presence:p,t:Date.now()}]));if(!list.has(me))list.set(me,mine);notify(old)}
          else if(m.k==='msg')deliver(m.topic,m.data,m.from)});
        const lost=()=>{if(hostConn===c)hostConn=null;setConn(false);const old=snap;list=new Map([[me,list.get(me)]]);notify(old);if(!left)setTimeout(connect,opened?1500:3000)};
        c.on('close',lost);c.on('error',lost)};
      connected=false;connect();
      await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('nohost')),10000);const iv=setInterval(()=>{if(hostConn){clearTimeout(t);clearInterval(iv);res()}},100)}).catch(e=>{left=true;try{peer.destroy()}catch(x){}throw e});
      peer.on('disconnected',()=>{if(!left)setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)})}
    const R={name,
      presence:async patch=>{const e=list.get(me),p={...e.presence};Object.entries(patch||{}).forEach(([k,v])=>{if(v===null)delete p[k];else p[k]=v});const old=snap;list.set(me,{presence:p,t:Date.now()});notify(old);
        if(host)hostSendList();else if(hostConn)hostConn.send({k:'pres',p})},
      emit:async(topic,data)=>{if(host)hostEmit(topic,data,me);else if(hostConn)hostConn.send({k:'emit',topic,data})},
      on:(topic,fn)=>{(handlers[topic]=handlers[topic]||[]).push(fn);return()=>{handlers[topic]=handlers[topic].filter(x=>x!==fn)}},
      peers:()=>snap,

    if(T.gp.some(x=>!tradeable(S,T.f,x))||T.rp.some(x=>!tradeable(S,p,x)))return 'L’offre n’est plus valable.';
    if(F.money<T.gm)return `${F.n} n’a plus assez d’argent.`;if(P.money<T.rm)return 'Pas assez d’argent.';

  case 'refuse':{
    const T=S.trade;if(!T||T.t!==p)return 'Aucune offre pour toi.';S.trade=null;log(S,`${P.n} refuse l’échange.`);return null}

    fetch('audio/manifest.json').then(r=>r.json()).then(man=>{const jobs=[];
      const get=(key,url)=>jobs.push(fetch(url).then(r=>r.arrayBuffer()).then(a=>new Promise((res,rej)=>AC.decodeAudioData(a,res,rej))).then(b=>{B.buf[key]=b}).catch(()=>{}));
      man.fx.forEach(n=>get('fx/'+n,`audio/fx/${n}.mp3`));
      Object.keys(man).filter(k=>k!=='fx').forEach(k=>{B.notes[k]=man[k];man[k].forEach(m=>get(k+'/'+m,`audio/${k}/${m}.mp3`))});
      // les bruitages d'abord sont petits : prêts en premier ; la musique bascule quand tout est là

  B.has=k=>!!B.buf[k];

  const ep=(d,m,t,dur,vol)=>{if(S()&&BANK.note('piano',m,t,dur,{vol:vol*3.4,dest:d,rel:.6}))return;const f=mtof(m);tone(d,f,t,dur,{type:'sine',vol,att:.004,rel:.25});tone(d,f*2,t,dur*.35,{type:'sine',vol:vol*.28,att:.002})};
  const hat=(d,t,vol)=>{if(S()&&BANK.fx('hat',t,{vol:vol*7,dest:d,rate:1.1}))return;noise(d,t,.05,{vol,freq:8000,q:.8,type:'highpass'})};

  // valse musette (menus) : accordéon (harmonium), contrebasse, guitare manouche
  const W={bpm:150,beats:3,bars:16,
    ch:['C','C','G7','G7','G7','G7','C','C','C','C7','F','F','C','G7','C','C'],
    tones:{C:[60,64,67],G7:[59,62,65,67],C7:[60,64,67,70],F:[60,65,69]},root:{C:48,G7:43,C7:48,F:41},
    mel:[[[67,1],[72,1],[76,1]],[[74,2],[72,1]],[[71,1],[74,1],[79,1]],[[77,2],[74,1]],[[77,1],[76,1],[74,1]],[[71,1],[72,1],[74,1]],[[76,2],[72,1]],[[67,3]],
         [[67,1],[72,1],[76,1]],[[79,2],[76,1]],[[77,1],[81,1],[84,1]],[[81,2],[77,1]],[[79,1],[76,1],[72,1]],[[74,1],[77,1],[71,1]],[[72,1],[76,1],[79,1]],[[84,2],[0,1]]],
    bar(d,b,loop,t,bt){const c=this.ch[b],r=this.root[c];bass(d,b%2?r+7-12:r,t,bt*.85,.2);
      [1,2].forEach(k=>{strum(d,this.tones[c].map(m=>m-12),t+k*bt,bt*.5,.11);brush(d,t+k*bt,.22)});
      const oct=loop%2?-12:0,v=loop%2?.07:.085;let x=0;this.mel[b].forEach(([m,l])=>{if(m)acc(d,m+oct,t+x*bt,l*bt*.92,v);x+=l});
      if(loop%2&&b%4===3)acc(d,this.tones[c][2]+12,t+2*bt,bt*.8,.04)}};
  // lo-fi douce (partie) : piano, contrebasse, batterie feutrée, craquement de vinyle
  const L={bpm:80,beats:4,bars:16,
    prog:[['F',41,[53,57,60,64]],['E',40,[52,55,59,62]],['D',38,[50,53,57,60]],['C',36,[48,52,55,59]],['F',41,[53,57,60,64]],['E',40,[52,55,59,62]],['D',38,[50,53,57,60]],['G',43,[50,53,55,59]]],
    pent:[72,74,76,79,81,84],last:76,seed:7,
    rnd(){this.seed=this.seed*16807%2147483647;return this.seed/2147483647},

    // échantillons arrivés : on relance le morceau en cours (fondu) pour passer aux vrais instruments
    restart(){if(!AC||!cur)return;const w=cur;cur=null;want=w;start()}};
})();

function confetti(dur=6500){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  const rs=()=>{c.width=innerWidth*dpr;c.height=innerHeight*dpr};rs();
  const cols=['#FFD23F','#F2463A','#2BC46B','#3D8BFD','#E0569B','#FFFFFF',...(S?S.players.map(p=>p.c):[])];
  const W=innerWidth,H=innerHeight,mk=(k,x,y,vx,vy)=>({x,y,vx,vy,r:Math.random()*6,vr:(Math.random()-.5)*.25,w:6+Math.random()*7,h:9+Math.random()*9,c:cols[k%cols.length],sh:Math.random()<.3?'c':'r',sw:Math.random()*6});
  const P=[...Array(240)].map((_,k)=>k<100?mk(k,Math.random()*W,-20-Math.random()*H*.6,(Math.random()-.5)*2,2+Math.random()*2.5)
    :mk(k,k%2?-10:W+10,H*.75,(k%2?1:-1)*(5+Math.random()*9),-(9+Math.random()*10)));
  const t0=performance.now();let last=t0;const step=now=>{const u=(now-t0)/dur,f=Math.min(4,(now-last)/16.7);last=now;x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy=Math.min(p.vy+.22*f,4.5);p.vx*=Math.pow(.985,f);p.x+=(p.vx+Math.sin(now/300+p.sw)*.6)*f;p.y+=p.vy*f;p.r+=p.vr*f;if(p.y>H+20&&u<.55){p.y=-20;p.x=Math.random()*W;p.vy=2}
      x.save();x.globalAlpha=Math.max(0,Math.min(1,(1-u)*3));x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.sh==='c'){x.beginPath();x.arc(0,0,p.w*.45,0,7);x.fill()}else{x.scale(1,Math.abs(Math.cos(now/200+p.sw)));x.fillRect(-p.w/2,-p.h/2,p.w,p.h)}x.restore()});
    if(u<1)requestAnimationFrame(step);else c.remove()};requestAnimationFrame(step)}

  const n=6;for(let j=0;j<n;j++){const c=document.createElement('span');c.className='coin fly';hud.appendChild(c);const lift=-60-Math.random()*50,dx=(Math.random()-.5)*30;

  events();renderPlates();renderFeed();renderDock();renderModal();renderDeed();renderCard();renderConn();renderTip();
}
function turnAlert(){if(!document.hidden)return;SFX.play('turn');SFX.play('coin',.45);clearInterval(turnAlert.h);const base='Le Grand Paris';let on=false;
  turnAlert.h=setInterval(()=>{on=!on;document.title=on?'🎲 À toi de jouer !':base},900);
  const stop=()=>{if(document.hidden)return;clearInterval(turnAlert.h);document.title=base;document.removeEventListener('visibilitychange',stop)};document.addEventListener('visibilitychange',stop)}
function quitGame(){if(S&&S.phase==='over')LS.del(mode==='local'?'lgp-local':'lgp-host');
  if(groom)groom.leave().catch(()=>{});groom=null;S=null;mode=null;isHost=false;UI.modal=null;UI.plateSig='';UI.passShow=null;closeOvl();render()}
function wireHUD(){
  const g=document.getElementById('game'),gear=document.getElementById('gear');
  gear.onclick=e=>{e.stopPropagation();openPause()};
  const openPlate=k=>{UI.as=k;UI.modal='props';render()};
  g.addEventListener('pointerover',e=>{if(!S||e.pointerType==='touch')return;const sq=e.target.closest('[data-hsq]'),pl=e.target.closest('[data-plate]');
    if(sq){const i=+sq.dataset.hsq;if(UI.hovI===i&&UI.hov==='sq')return;UI.hov='sq';UI.hovI=i;G.hopK=null;boardGlow([i],'#FFD23F',1);if(sq.closest('#modal.dockr'))boardFocus(i);return}
    if(pl){const k=+pl.dataset.plate;if(UI.hov==='pl'&&UI.hovI===k)return;UI.hov='pl';UI.hovI=k;boardFocus(null);G.hopK=k;const P=S.players[k];
      boardGlow(S.own.map((w,i)=>w&&w[0]===k?i:-1).filter(i=>i>=0),P.c,.9);if(P&&!P.out)SFX.play('pop');return}
    if(UI.hov)hoverOff()});
  g.addEventListener('pointerleave',()=>{if(UI.hov)hoverOff()});
  g.addEventListener('keydown',e=>{const pl=e.target.closest&&e.target.closest('[data-plate]');if(pl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();openPlate(+pl.dataset.plate)}});
  g.addEventListener('click',e=>{
    if(e.target.closest('.gb,.tool,.ptab,.tchip,.x'))SFX.play('click');
    const b=e.target.closest('[data-k]');if(b&&!b.disabled){const x=ACTS[+b.dataset.k];{const md=document.querySelector('#dock .mdeed');if(md&&(x.a.a==='buy'||x.a.a==='bid'||x.a.a==='pass'))UI.fly={sq:+md.dataset.hsq,r:md.getBoundingClientRect(),t:performance.now()}}if(x.a.a==='propose'){UI.modal=null;draft={to:-1,gp:[],rp:[],gm:0,rm:0}}perform(x.p,x.a);return}
    const pl=e.target.closest('[data-plate]');if(pl){openPlate(+pl.dataset.plate);return}
    const po=e.target.closest('[data-passok]');if(po){UI.passShow=null;render();return}
    const rc=e.target.closest('[data-react]');if(rc){if(rc.dataset.react==='t'){UI.reactOpen=!UI.reactOpen;renderDock()}else sendReact(+rc.dataset.react);return}
    if(e.target.closest('[data-connquit]')){quitGame();return}
    const co=e.target.closest('[data-cardok]');if(co){UI.cardOk=co.dataset.cardok;render();return}
    const tf=e.target.closest('[data-tradefor]');if(tf){const i=+tf.dataset.tradefor,o=S.own[i];if(o){draft={to:o[0],gp:[],rp:[i],gm:0,rm:0};UI.modal='trade';UI.tradeKeep=true;selSq=null;render()}return}
    const as=e.target.closest('[data-as]');if(as){UI.as=+as.dataset.as}
    const u=e.target.closest('[data-ui]');if(u){const v=u.dataset.ui;UI.modal=v==='close'?null:v;if(u.dataset.mine)UI.as=null;if(v==='trade'){draft={to:-1,gp:[],rp:[],gm:0,rm:0}}render();return}
    if(as){render();return}
    const sq=e.target.closest('[data-sq]');if(sq){selSq=+sq.dataset.sq;render();return}
    const t=e.target.closest('[data-tto]');if(t){draft.to=+t.dataset.tto;draft.rp=[];render();return}
    const gp=e.target.closest('[data-g]');if(gp){const i=+gp.dataset.g;draft.gp=draft.gp.includes(i)?draft.gp.filter(x=>x!==i):[...draft.gp,i];render();return}
    const rp=e.target.closest('[data-r]');if(rp){const i=+rp.dataset.r;draft.rp=draft.rp.includes(i)?draft.rp.filter(x=>x!==i):[...draft.rp,i];render();return}
    const st=e.target.closest('[data-step]');if(st){const[id,d]=st.dataset.step.split(':');const key=id==='tgm'?'gm':'rm';draft[key]=Math.max(0,(+draft[key]||0)+ +d);render();return}
    if(e.target.closest('#again')){replay();return}if(e.target.closest('#tomenu'))quitGame();
    if(e.target.id==='modal'&&S&&S.phase!=='over'&&!UI.passShow){UI.modal=null;render()}
  });
  g.addEventListener('change',e=>{if(e.target.id==='tgm'){draft.gm=Math.max(0,+e.target.value||0);render()}if(e.target.id==='trm'){draft.rm=Math.max(0,+e.target.value||0);render()}});
  window.addEventListener('keydown',e=>{if(!S||document.getElementById('game').hidden||(G&&G.intro)||OVL.kind)return;{const r=document.getElementById('rules');if(r&&!r.hidden)return}if(e.target.closest&&e.target.closest('input,select,textarea,[data-plate]'))return;
    if(e.key==='Escape'){if(UI.modal&&S.phase!=='over'){UI.modal=null;render()}else if(selSq!=null){selSq=null;render()}else if(!G.photo)openPause();return}
    if(e.key===' '||e.key==='Enter'){
      const pass=document.querySelector('#modal [data-passok]');if(pass){e.preventDefault();pass.click();return}
      const ok=document.querySelector('#cardpop:not([hidden]) [data-cardok]');if(ok){e.preventDefault();ok.click();return}
      if(!UI.modal&&document.getElementById('modal').hidden){const b=document.querySelector('#dock [data-primary]:not(:disabled)');if(b){e.preventDefault();b.click()}}}});
  // intro : interface masquée, bouton « Passer »
  setInterval(()=>{document.body.classList.toggle('intro',!!(G&&G.intro&&!G.fail))},150);
  document.getElementById('skipintro').addEventListener('click',()=>{if(G&&G.intro)G.intro.t=1});
}

/* ================= Chargement et rendu global ================= */
const TIPS=['On plante les cerisiers du parc…','On bâtit les immeubles haussmanniens…','On remplit la Seine…','On lustre les pions dorés…','On mélange les cartes Chance…','On imprime les billets…'];
function loading(on){const L=document.getElementById('loading'),bar=L.querySelector('.lbar i'),tip=document.getElementById('ltip');
  if(on){L.hidden=false;L.classList.remove('done');bar.style.transition='none';bar.style.width='4%';void bar.offsetWidth;bar.style.transition='width 5s cubic-bezier(.2,.7,.3,1)';bar.style.width='88%';
    let k=Math.floor(Math.random()*TIPS.length);tip.textContent=TIPS[k];clearInterval(loading.h);loading.h=setInterval(()=>{k=(k+1)%TIPS.length;tip.textContent=TIPS[k]},1400)}
  else{bar.style.transition='width .35s ease-out';bar.style.width='100%';clearInterval(loading.h);setTimeout(()=>{L.classList.add('done');setTimeout(()=>{L.hidden=true},500)},380)}}
let built=false,TITLE=true;
function boot(){if(built)return;built='pending';document.getElementById('home').hidden=true;document.getElementById('game').hidden=false;loading(true);
  requestAnimationFrame(()=>setTimeout(()=>{try{buildBoard()}catch(e){console.error(e)}finally{wireHUD();built=true;try{applyCB()}catch(e){}loading(false);render()}},60))}
function render(){
  const inGame=!!S,has3d=built===true&&G&&!G.fail;
  if(built!==true){if(!built)boot();return}
  document.getElementById('home').hidden=inGame;document.getElementById('game').hidden=!inGame&&!has3d;
  document.body.classList.toggle('menu3d',!inGame&&has3d);document.body.classList.toggle('no3d',!has3d);
  if(!inGame){if(OVL.kind==='pause')closeOvl();homeView();if(!TITLE)MUSIC.want('menu');return}
  if(has3d&&UI.introGid!==S.gid){UI.introGid=S.gid;const fresh=(S.roll||0)===0&&(S.rnd||1)===1;if(fresh&&!UI.skipIntro&&G.startIntro)G.startIntro();else if(G.resetCam)G.resetCam();UI.skipIntro=false;SFX.play('start')}
  MUSIC.want(S.phase==='over'?'menu':'game',S.phase==='over'?4:0);
  renderBoard();renderHUD();
}
render();
(async()=>{try{room=SITE?(window.Peer?NETROOM:null):(window.claude&&window.claude.use?await window.claude.use('room'):null)}catch(e){room=null}if(!mode)render()})();
</script>
